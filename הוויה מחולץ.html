<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>הוויה | לובשת מלכות</title>
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@400;500;700&family=Assistant:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--w:#FFFDF9;--cream:#F6EFE4;--sand:#E5D6BF;--ink:#1A1714;--mut:#6F665A;--line:#EADFCC;--rose:#EBD3D0;--sage:#D5DFD1;--lav:#DDD6E6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--w);color:var(--ink);font-family:Assistant,Arial,sans-serif;font-size:17px;line-height:1.7}
h1,h2,h3{font-family:'Frank Ruhl Libre',David,serif;font-weight:500;line-height:1.25;margin:0 0 .4em}
h1{font-size:clamp(2.3rem,8vw,3.6rem)}h2{font-size:1.8rem}h3{font-size:1.2rem}p{margin:0 0 1em}
button{font:inherit;cursor:pointer;color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--w);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:10px 18px}
.logo{background:none;border:0;padding:0;display:flex;align-items:center}
.logo img{height:56px;width:auto}
.ph-logo{border:1px dashed var(--mut);border-radius:8px;padding:2px 12px;font-size:.8rem;color:var(--mut)}
.menu{background:var(--cream);border:0;border-radius:99px;padding:8px 18px}
.sheet{position:fixed;inset:0;z-index:30;background:rgba(26,23,20,.4);display:none}
.sheet.on{display:block}
.sheet div{background:var(--w);width:min(320px,86%);height:100%;padding:calc(24px + env(safe-area-inset-top,0px)) 20px 20px;display:flex;flex-direction:column;gap:4px;animation:in .25s}
@keyframes in{from{transform:translateX(30px);opacity:0}}
.sheet button{background:none;border:0;text-align:right;padding:12px 10px;border-radius:12px;font-size:1.1rem}
.sheet button.on{background:var(--cream)}
.wrap{max-width:960px;margin:0 auto;padding:26px 20px 70px}
.hero{text-align:center;padding:30px 0 10px}
.hero p{color:var(--mut);font-size:1.15rem}
.img{border-radius:20px;display:flex;align-items:center;justify-content:center;text-align:center;color:var(--mut);font-size:.9rem;padding:12px;min-height:150px}
.img.hero-img{min-height:230px;margin:22px 0;background:linear-gradient(135deg,var(--rose),var(--cream) 55%,var(--lav))}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.card{background:var(--cream);border-radius:20px;padding:20px;border:0;text-align:right;width:100%}
.card.w{background:var(--w);border:1px solid var(--line)}
button.card{transition:transform .2s}button.card:hover{transform:translateY(-2px)}
.tag{display:inline-block;font-size:.8rem;background:var(--w);border-radius:99px;padding:0 12px;margin-bottom:8px}
.btn{background:var(--ink);color:var(--w);border:0;border-radius:99px;padding:11px 28px;font-weight:600}
.btn.big{padding:15px 24px;width:100%}
.btn.o{background:none;color:var(--ink);border:1px solid var(--ink)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px;align-items:center}
.stack{display:flex;flex-direction:column;gap:12px;margin:20px 0}
.mut{color:var(--mut)}.back{background:none;border:0;padding:0;margin-bottom:12px;text-decoration:underline}
.bar{height:7px;background:var(--sand);border-radius:9px;overflow:hidden;margin:8px 0}.bar span{display:block;height:100%;background:var(--ink);border-radius:9px;transition:width .4s}
.video{aspect-ratio:16/9;background:var(--sand);border-radius:20px;display:flex;align-items:center;justify-content:center;flex-direction:column;color:var(--mut);margin-bottom:18px}
.video b{font-size:2.2rem;color:var(--ink);font-weight:400}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.chips button{background:var(--w);border:1px solid var(--line);border-radius:99px;padding:2px 16px}.chips button.on{background:var(--ink);color:var(--w);border-color:var(--ink)}
input,textarea{width:100%;font:inherit;border:1px solid var(--sand);background:var(--w);border-radius:14px;padding:11px 14px;margin-bottom:10px}
.step{display:flex;gap:14px;padding:14px 0;border-top:1px solid var(--line)}.step i{font-style:normal;width:32px;height:32px;border-radius:50%;background:var(--sand);display:flex;align-items:center;justify-content:center;flex:none}
.fav{background:none;border:0;font-size:1.4rem;float:left}
details{background:var(--cream);border-radius:16px;padding:14px 18px;margin-bottom:10px}summary{cursor:pointer;font-weight:600}
.note{font-size:.85rem;color:var(--mut);border-top:1px solid var(--line);margin-top:28px;padding-top:12px}
.view{animation:fade .35s}@keyframes fade{from{opacity:0}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

const promoOn=()=>!PROMO_END||Date.now()<new Date(PROMO_END).getTime();
function cdText(){if(!PROMO_END)return'';const t=new Date(PROMO_END).getTime()-Date.now();if(t<=0)return'';const d=Math.floor(t/864e5),h=Math.floor(t%864e5/36e5),m=Math.floor(t%36e5/6e4);return `נותרו ${d} ימים, ${h} שעות ו־${m} דקות`}
function promo(){if(!promoOn())return'';return `<div class="card" style="background:linear-gradient(135deg,var(--rose),var(--cream) 55%,var(--lav));text-align:center;margin-bottom:22px;padding:26px 20px">${PROMO_IMG?`<img src="${PROMO_IMG}" alt="" style="width:100%;height:260px;object-fit:cover;object-position:center 35%;border-radius:16px;margin-bottom:14px">`:`<div style="width:84px;height:84px;margin:0 auto 14px;border-radius:50%;border:3px solid var(--ink);background:conic-gradient(var(--rose) 0 60deg,var(--sage) 60deg 120deg,var(--lav) 120deg 180deg,var(--sand) 180deg 240deg,var(--rose) 240deg 300deg,var(--sage) 300deg 360deg)"></div>`}<h2 style="margin-bottom:.2em">מתנה מחכה לך</h2><p>בכל הזמנה באתר את מסובבת את גלגל המזל וזוכה במתנה.</p><p style="font-size:.95rem">המתנות בגלגל: ${PRIZES.join(', ')}.</p><p class="mut" id="cd">${cdText()}</p><button class="btn big" data-go="wheel">לגלגל המזל</button><p class="mut" style="font-size:.8rem;margin:10px 0 0">המתנה למזמינות בלבד ומצורפת להזמנה. התנאים יוגדרו על ידי הוויה.</p></div>`}
setInterval(()=>{const e=document.getElementById('cd');if(e)e.textContent=cdText()},30000);
function home(){return `${promo()}<section class="hero"><h1>הוויה – לובשת מלכות</h1><p>המקום שלך ללמוד, לגלות ולהרגיש בבית.</p></section>
<img src="${IMGS.p1}" alt="" style="width:100%;height:340px;object-fit:cover;object-position:center 28%;border-radius:20px;margin:22px 0">
<div class="stack"><button class="btn big" data-go="academy">לאקדמיית הקשירות</button><button class="btn big o" data-go="journey">למסע האישי שלי</button><button class="btn big o" data-go="library">לספריית הידע</button></div>
<h2>מדריכים מומלצים</h2><div class="grid">${GUIDES.slice(0,3).map(gcard).join('')}</div>
<div class="row"><button class="btn o" data-go="shop">לחנות</button><button class="btn o" data-go="support">למרכז התמיכה</button><button class="btn o" data-go="wheel">גלגל המזל</button></div>
<div class="card" style="margin-top:26px"><h3>הקבוצה שלנו בוואטסאפ</h3><p>אפשר להצטרף ולהתכתב איתנו שם.</p>${GROUP_URL?`<a class="btn" style="display:inline-block;text-decoration:none" target="_blank" rel="noopener" href="${GROUP_URL}">להצטרפות לקבוצה</a>`:'<button class="btn" disabled>הקישור לקבוצה יתווסף בהמשך</button>'}</div>
<p class="note">גרסת הדגמה. תכני הלימוד להחלפה.</p>`}
function academy(){return `<h2>אקדמיית הקשירות של הוויה</h2><p class="mut">בחרי קטגוריה.</p><div class="grid">`+CATS.map((c,i)=>`<button class="card" data-go="cat" data-x="${i}"><h3>${c}</h3><span class="mut">${GUIDES.filter(g=>g.c===i).length} מדריכים</span></button>`).join('')+`</div>`}
function cat(){const l=GUIDES.filter(g=>g.c===S.cat);return `<button class="back" data-go="academy">חזרה לאקדמיה</button><h2>${CATS[S.cat]}</h2><div class="grid">${l.map(gcard).join('')||'<p class="mut">עוד אין כאן מדריכים. אפשר להוסיף.</p>'}</div>`}
function guide(){const g=G(S.g),i=GUIDES.indexOf(g),nx=GUIDES[i+1];S.last=g.id;
return `<button class="back" data-go="cat" data-x="${g.c}">חזרה ל${CATS[g.c]}</button><div class="video"><b>▶</b>כאן יוצב הסרטון</div>
<button class="fav" data-fav="${g.id}" aria-label="מועדף">${S.fav[g.id]?'♥':'♡'}</button><h2>${g.t}</h2><p class="mut">כאן יופיע הסבר קצר על הקשירה והבד המתאים לה.</p>
<h3>שלבי ביצוע</h3>${g.s.map((x,k)=>`<div class="step"><i>${k+1}</i><div>${x}</div></div>`).join('')}
<div class="row"><button class="btn ${S.done[g.id]?'o':''}" data-done="${g.id}">${S.done[g.id]?'✓ הושלם':'סמני כהושלם'}</button>${nx?`<button class="btn o" data-go="guide" data-x="${nx.id}">למדריך הבא</button>`:''}</div>`}
function journey(){const n=stN();return `<h2>המסע האישי שלי</h2>${bar(pct(n,5))}<p class="mut">${n} מתוך 5 שלבים הושלמו</p><div class="stack">`+STAGES.map((s,i)=>`<div class="card w"><span class="tag">שלב ${i+1}</span><h3>${s[0]}</h3><p>${s[1]}</p><p><strong>משימה מעשית:</strong> ${s[2]}</p><button class="btn ${S.st[i]?'o':''}" data-st="${i}">${S.st[i]?'✓ הושלם':'סמני כהושלם'}</button></div>`).join('')+`</div>`}
function library(){return `<h2>ספריית הידע</h2><input type="search" id="q" placeholder="חיפוש בספרייה" value="${S.q}" aria-label="חיפוש"><div class="chips">${LTOPICS.map(t=>`<button data-f="${t}" class="${S.f===t?'on':''}">${t}</button>`).join('')}</div><div class="grid" id="list"></div>`}
function list(){const r=LIB.filter(i=>(S.f==='הכל'||i[1]===S.f)&&(i[0]+i[2]).includes(S.q.trim()));
$('#list').innerHTML=r.length?r.map(i=>`<div class="card"><span class="tag">${i[0]}</span><h3>${i[2]}</h3></div>`).join(''):'<p class="mut">לא נמצאו תוצאות. נסי נושא אחר.</p>'}
function support(){return `<h2>מרכז התמיכה</h2><h3>שאלות נפוצות</h3>${FAQ.map(f=>`<details><summary>${f[0]}</summary><p>${f[1]}</p></details>`).join('')}
<div class="card" style="margin:20px 0"><h3>ייעוץ קשירה אישי</h3><p>כאן יופיע הסבר על הייעוץ האישי.</p>${WHATSAPP_URL?`<a class="btn" href="${WHATSAPP_URL}" style="display:inline-block;text-decoration:none">לוואטסאפ</a>`:'<button class="btn" disabled>וואטסאפ – הקישור יתווסף בהמשך</button>'}</div>
<div class="card w"><h3>משלוחים ושירות לקוחות</h3><p class="mut">כאן יוזנו פרטי המשלוחים ושעות השירות, כשתספקי אותם.</p></div>
<h3 style="margin-top:24px">שליחת שאלה</h3><input placeholder="שם" aria-label="שם"><textarea placeholder="השאלה שלך" aria-label="שאלה"></textarea>
<button class="btn" disabled>שליחה – הטופס עדיין לא מחובר</button><p class="note">הטופס אינו שולח מידע. הוא יופעל רק לאחר חיבור לשירות אמיתי.</p>`}
function me(){const t=GUIDES.length,d=doneN(),fv=GUIDES.filter(g=>S.fav[g.id]),l=S.last&&G(S.last);
return `<h2>האזור האישי</h2><p class="mut">הנתונים כאן הם הדגמה בלבד, ומתעדכנים לפי מה שתלחצי בזמן שהדף פתוח.</p>
<div class="grid"><div class="card"><h3>מדריכים שהושלמו</h3>${bar(pct(d,t))}<span class="mut">${d} מתוך ${t} (${pct(d,t)}%)</span></div><div class="card"><h3>מסע אישי</h3>${bar(pct(stN(),5))}<span class="mut">${stN()} מתוך 5 שלבים</span></div></div>
<div class="row">${l?`<button class="btn" data-go="guide" data-x="${l.id}">להמשך מהמקום שעצרת: ${l.t}</button>`:'<button class="btn" data-go="academy">להתחלת מדריך ראשון</button>'}</div>
<h3 style="margin-top:26px">מדריכים מועדפים</h3><div class="grid">${fv.map(gcard).join('')||'<p class="mut">עוד אין מועדפים. סמני ♡ בתוך מדריך.</p>'}</div>
<h3 style="margin-top:26px">מדריכים שהתחלתי</h3><div class="grid">${GUIDES.filter(g=>S.done[g.id]).map(gcard).join('')||'<p class="mut">עוד אין מדריכים שהושלמו.</p>'}</div>`}
function spin(){if(S.spun||S.spinning)return;S.spinning=true;const n=PRIZES.length,a=360/n,k=crypto.getRandomValues(new Uint32Array(1))[0]%n;S.rot=Math.ceil((S.rot||0)/360)*360+1800-(k+.5)*a;$('#wh').style.transform='rotate('+S.rot+'deg)';setTimeout(()=>{S.prize=PRIZES[k];S.spun=true;S.spinning=false;render()},4300)}
function wheel(){const n=PRIZES.length,a=360/n,cols=['var(--rose)','var(--sage)','var(--lav)','var(--sand)'];
return `<h2>גלגל המזל</h2><p class="mut">סובבי פעם אחת וגלי אם זכית במתנה. הפרס יצורף להודעת ההזמנה שלך.</p>
<div dir="ltr" style="position:relative;width:min(300px,80vw);margin:30px auto"><div style="position:absolute;top:-14px;left:50%;transform:translateX(-50%);z-index:2;width:0;height:0;border:12px solid transparent;border-top:22px solid var(--ink);border-bottom:0"></div>
<div id="wh" style="position:relative;aspect-ratio:1;border-radius:50%;border:4px solid var(--ink);background:conic-gradient(${PRIZES.map((_,i)=>cols[i%4]+' '+i*a+'deg '+(i+1)*a+'deg').join(',')});transform:rotate(${S.rot||0}deg);transition:transform 4s cubic-bezier(.17,.67,.2,1)">${PRIZES.map((p,i)=>`<span style="position:absolute;inset:0;transform:rotate(${(i+.5)*a}deg)"><b style="position:absolute;top:9%;left:50%;transform:translateX(-50%);width:84px;text-align:center;font-size:.64rem;line-height:1.2;font-weight:600">${p}</b></span>`).join('')}</div></div>
${S.spun?`<div class="card w" style="text-align:center"><h3>זכית: ${S.prize}</h3><p class="mut">הפרס יצורף להודעת ההזמנה, והוויה תאשר אותו מולך בוואטסאפ.</p><button class="btn" data-go="cart">לעגלה ולשליחת ההזמנה</button></div>`:`<button class="btn big" data-spin="1">סובבי את הגלגל</button>`}
<p class="note">סיבוב אחד בכל כניסה לדף. התנאים יוגדרו על ידי הוויה.</p>`}
const total=()=>PRODUCTS.reduce((a,p)=>a+(S.cart[p.id]||0)*p.pr,0);
const cnt=()=>Object.values(S.cart).reduce((a,b)=>a+b,0);
const left=p=>STOCK[p.id]===undefined?Infinity:STOCK[p.id]-(S.cart[p.id]||0);
const stockBtn=p=>STOCK[p.id]===0?'<button class="btn" disabled>אזל מהמלאי</button>':left(p)<=0?'<button class="btn" disabled>כל המלאי כבר בעגלה</button>':`<button class="btn" data-add="${p.id}">${S.cart[p.id]?'נוסף ('+S.cart[p.id]+') – להוסיף עוד':'הוספה לעגלה'}</button>`+(STOCK[p.id]!==undefined&&STOCK[p.id]<=3?`<p class="mut" style="margin:8px 0 0">נותרו ${STOCK[p.id]} בלבד</p>`:'');
const msg=()=>{const l=PRODUCTS.filter(p=>S.cart[p.id]);let i=0;const by=COLLS.map(c=>{const a=l.filter(p=>collOf(p)===c);return a.length?'*'+c+'*\n'+a.map(p=>(++i)+'. '+p.n+' × '+S.cart[p.id]+' = '+S.cart[p.id]*p.pr+' ₪').join('\n'):''}).filter(Boolean).join('\n\n');return 'שלום, אני מעוניינת להזמין:\n\n'+by+'\n\nסה״כ: '+cnt()+' פריטים\nסכום: '+total()+' ₪ (לפני מתנות והטבות)'+(S.name?'\nשם: '+S.name:'')+(S.prize?'\nזכיתי בגלגל המזל: '+S.prize:'')+'\n\nאשמח לתיאום תשלום ומשלוח.'};
function shop(){return `<h2>החנות</h2><p class="mut">בחרי מוצרים והוסיפי לעגלה. את ההזמנה תשלחי בוואטסאפ.</p><div class="row"><button class="btn o" data-go="cart">לעגלה (${cnt()})</button><button class="btn o" data-go="wheel">גלגל המזל</button></div><div class="chips">${['הכל',...COLLS].map(c=>`<button data-sf="${c}" class="${(S.sf||'הכל')===c?'on':''}">${c}</button>`).join('')}</div><div class="grid">`+PRODUCTS.filter(p=>(S.sf||'הכל')==='הכל'||collOf(p)===S.sf).map(p=>`<div class="card w"><img src="${IMGS[p.id]}" alt="${p.n}" loading="lazy" style="width:100%;border-radius:16px;display:block"><h3 style="margin-top:12px">${p.n}</h3><p style="font-size:1.1rem;margin:0 0 10px"><strong>${p.pr} ₪</strong></p>${stockBtn(p)}</div>`).join('')+`</div>`}
function cart(){const l=PRODUCTS.filter(p=>S.cart[p.id]);if(!l.length)return `<h2>העגלה</h2><p class="mut">העגלה ריקה. בחרי מוצרים בחנות.</p><button class="btn" data-go="shop">לחנות</button>`;
const send=WHATSAPP_PHONE?`<a class="btn big" style="display:block;text-align:center;text-decoration:none" target="_blank" rel="noopener" href="https://wa.me/${WHATSAPP_PHONE}?text=${encodeURIComponent(msg())}">שליחת ההזמנה בוואטסאפ</a>`:`<button class="btn big" disabled>שליחה בוואטסאפ – המספר יתווסף בהמשך</button>`;
return `<h2>העגלה</h2><div class="stack">`+l.map(p=>`<div class="card w"><h3>${p.n} <span class="mut" style="font-size:1rem">· ${p.pr} ₪</span></h3><div class="row"><button class="btn o" data-dec="${p.id}" aria-label="הפחתה">−</button><strong>${S.cart[p.id]}</strong><button class="btn o" data-inc="${p.id}" aria-label="הוספה">+</button></div></div>`).join('')+`</div><p><strong>סה״כ: ${total()} ₪</strong> <span class="mut">לפני מתנות והטבות</span></p><input id="cname" placeholder="השם שלך (לא חובה)" value="${S.name||''}" aria-label="שם"><h3>ההודעה שתישלח</h3><textarea readonly id="cmsg" rows="10" aria-label="תצוגת ההודעה">${msg()}</textarea>${send}<p class="note">התשלום אינו מתבצע באתר. לאחר שליחת ההודעה, התשלום והמשלוח מתואמים מולך בוואטסאפ. העגלה נשמרת רק כל עוד הדף פתוח.</p>`}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const d=b.dataset;
 if(d.menu)$('#sheet').classList.add('on');
 else if(d.go)go(d.go,d.x);
 else if(d.done){S.done[d.done]=!S.done[d.done];render()}
 else if(d.fav){S.fav[d.fav]=!S.fav[d.fav];render()}
 else if(d.st){S.st[d.st]=!S.st[d.st];render()}
 else if(d.add){S.cart[d.add]=(S.cart[d.add]||0)+1;render()}
 else if(d.inc){if(left(PRODUCTS.find(p=>p.id===d.inc))>0)S.cart[d.inc]++;render()}
 else if(d.sf){S.sf=d.sf;render()}
 else if(d.spin)spin()
 else if(d.dec){S.cart[d.dec]--;if(S.cart[d.dec]<1)delete S.cart[d.dec];render()}
 else if(d.f){S.f=d.f;render()}});
$('#sheet').addEventListener('click',e=>{if(e.target.id==='sheet')$('#sheet').classList.remove('on')});
document.addEventListener('input',e=>{if(e.target.id==='q'){S.q=e.target.value;list()}else if(e.target.id==='cname'){S.name=e.target.value;$('#cmsg').value=msg();const a=document.querySelector('a[href^="https://wa.me"]');if(a)a.href='https://wa.me/'+WHATSAPP_PHONE+'?text='+encodeURIComponent(msg())}});
render();
</script>
</body>
</html>
